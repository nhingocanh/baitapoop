<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>ADMIN - Cấu hình mẫu bóc tách</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #222d32; font-family: sans-serif; color: #b8c7ce; }
        .sidebar { background-color: #1a2226; height: 100vh; position: fixed; width: 240px; padding-top: 20px; }
        .sidebar a { color: #b8c7ce; text-decoration: none; display: block; padding: 12px 20px; }
        .main-content { margin-left: 240px; background-color: #ecf0f5; min-height: 100vh; color: #333; padding: 25px; }
        .box-header { background-color: #3c8dbc; color: white; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4 border-bottom pb-3">
            <h4 class="text-white fw-bold"><i class="fa-solid fa-user-shield"></i> ADMIN</h4>
            <small class="text-success"><i class="fa-solid fa-circle"></i> ADMIN - Online</small>
        </div>
        <a href="/" class="text-warning fw-bold"><i class="fa-solid fa-arrow-left"></i> Về Shop</a>
        <a href="/admin/providers" style="background:#1e282c; border-left:3px solid #3c8dbc;"><i class="fa-solid fa-truck"></i> Nhà cung cấp</a>
        <a href="/admin/products"><i class="fa-solid fa-laptop"></i> Đường dẫn sản phẩm</a>
    </div>
    <div class="main-content">
        <div class="card border-0 shadow-sm mx-auto" style="max-width: 750px;">
            <div class="box-header">CHỈNH SỬA NHÀ CUNG CẤP & MẪU LẤY DỮ LIỆU</div>
            <div class="bg-white p-4 rounded-bottom">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3"><label class="form-label fw-bold">Tên nhà cung cấp</label><input type="text" name="name" class="form-control" value="{{ provider.name if provider else '' }}" required></div>
                    <div class="mb-3"><label class="form-label fw-bold">Đường dẫn trang chủ</label><input type="url" name="url" class="form-control" value="{{ provider.url if provider else '' }}" required></div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Hình ảnh đại diện (Tập tin)</label>
                        <input type="file" name="image_file" class="form-control" accept="image/*">
                    </div>
                    <div class="mb-3"><label class="form-label fw-bold">Mẫu lấy tên sản phẩm</label><textarea name="name_pattern" class="form-control font-monospace" rows="2">{{ provider.name_pattern if provider else '#<h1 class="title">(.*?)</h1>#' }}</textarea></div>
                    <div class="mb-3"><label class="form-label fw-bold">Mẫu lấy giá bán sản phẩm</label><textarea name="price_pattern" class="form-control font-monospace" rows="2">{{ provider.price_pattern if provider else '#<span id="product_price">(.*?)</i>#' }}</textarea></div>
                    <div class="mb-3"><label class="form-label fw-bold">Trạng thái</label><select name="status" class="form-select"><option value="Hoạt động">Hoạt động</option><option value="Không hoạt động">Không hoạt động</option></select></div>
                    <button type="submit" class="btn btn-primary fw-bold"><i class="fa-solid fa-save"></i> LƯU THAY ĐỔI CẤU HÌNH</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
