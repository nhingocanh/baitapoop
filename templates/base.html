<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BCSE2025 SHOP | Futuristic Comparator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #041140 0%, #4A5FC1 100%); 
            min-height: 100vh; 
            color: #FFFFFF; 
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .text-light-gray { color: #D1D5DB !important; }
        .btn-neon { 
            background-color: #0B5CFF; 
            color: white; 
            font-weight: 600; 
            box-shadow: 0 4px 15px rgba(11, 92, 255, 0.4); 
            border: none;
        }
        .btn-neon:hover { background-color: #0046d5; color: white; }
        .glass-card { 
            background: rgba(14, 20, 56, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(10px); 
            border-radius: 12px; 
            color: #FFFFFF;
        }
        .navbar-custom { background: rgba(4, 17, 64, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-text { font-weight: 900; font-size: 26px; color: #FFFFFF; text-shadow: 0 0 10px #0B5CFF; }
        .list-group-item-custom { background: transparent; color: #D1D5DB; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .list-group-item-custom:hover { background: rgba(11, 92, 255, 0.1); color: #fff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom py-2 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="/" class="logo-text text-decoration-none"><i class="fa-solid fa-cube"></i> BCSE2025 SHOP</a>
            <form action="/" method="GET" class="d-flex w-50">
                <input type="text" name="keyword" class="form-control bg-dark text-white border-secondary me-2" placeholder="Tìm kiếm sản phẩm điện tử công nghệ..." value="{{ keyword or '' }}">
                <button type="submit" class="btn btn-neon px-4">QUÉT</button>
            </form>
            <a href="/admin/products" class="btn btn-sm btn-outline-light"><i class="fa-solid fa-user-gear"></i> ADMIN PANEL</a>
        </div>
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
