<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>ADMIN - Đường dẫn sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #222d32; font-family: sans-serif; color: #b8c7ce; }
        .sidebar { background-color: #1a2226; height: 100vh; position: fixed; width: 240px; padding-top: 20px; }
        .sidebar a { color: #b8c7ce; text-decoration: none; display: block; padding: 12px 20px; }
        .sidebar a:hover { background-color: #1e282c; color: #fff; }
        .main-content { margin-left: 240px; background-color: #ecf0f5; min-height: 100vh; color: #333; padding: 25px; }
        .box-header { background-color: #3c8dbc; color: white; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="text-center mb-4 border-bottom pb-3">
            <h4 class="text-white fw-bold"><i class="fa-solid fa-user-shield"></i> ADMIN</h4>
            <small class="text-success"><i class="fa-solid fa-circle"></i> ADMIN - Online</small>
        </div>
        <a href="/" class="text-warning fw-bold"><i class="fa-solid fa-arrow-left"></i> Về Shop</a>
        <a href="/admin/providers"><i class="fa-solid fa-truck"></i> Nhà cung cấp</a>
        <a href="/admin/products" style="background:#1e282c; border-left:3px solid #3c8dbc;"><i class="fa-solid fa-laptop"></i> Đường dẫn sản phẩm</a>
    </div>
    <div class="main-content">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="box-header"><i class="fa-solid fa-plus"></i> THÊM ĐƯỜNG DẪN CHI TIẾT</div>
                <div class="bg-white p-3 border rounded-bottom shadow-sm">
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-2"><label class="small fw-bold">Tên sản phẩm:</label><input type="text" name="name" class="form-control form-control-sm" required placeholder="Dell Inspiron 7567"></div>
                        <div class="mb-2"><label class="small fw-bold">Giá bán hiện tại:</label><input type="number" name="price" class="form-control form-control-sm" required></div>
                        <div class="mb-2"><label class="small fw-bold">Đánh giá sàn:</label><input type="number" step="0.1" name="rating" class="form-control form-control-sm" required></div>
                        <div class="mb-2"><label class="small fw-bold">Đường dẫn liên kết chi tiết:</label><input type="url" name="url" class="form-control form-control-sm" required></div>
                        <div class="mb-2"><label class="small fw-bold">Chọn nhà cung cấp sàn:</label>
                            <select name="provider_id" class="form-select form-select-sm">
                                {% for prov in providers %} <option value="{{ prov.id }}">{{ prov.name }}</option> {% endfor %}
                            </select>
                        </div>
                        <div class="mb-2"><label class="small fw-bold">Hình ảnh sản phẩm (Tập tin):</label><input type="file" name="product_image" class="form-control form-control-sm" accept="image/*"></div>
                        <div class="mb-3"><label class="small fw-bold">Trạng thái:</label><select name="status" class="form-select form-select-sm"><option value="Hoạt động">Hoạt động</option></select></div>
                        <button type="submit" class="btn btn-sm btn-primary w-100 fw-bold">LƯU ĐƯỜNG DẪN SẢN PHẨM</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="box-header">LIÊN KẾT ĐƯỜNG DẪN CƠ SỞ DỮ LIỆU ĐANG LƯU TRỮ</div>
                <div class="bg-white p-2 border rounded-bottom table-responsive">
                    <table class="table table-bordered table-sm text-center align-middle small">
                        <thead><tr><th>Tên sản phẩm</th><th>Giá bán</th><th>Nhà cung cấp</th><th>Đường dẫn cào</th><th>Xóa</th></tr></thead>
                        <tbody>
                            {% for p in products %}
                            <tr>
                                <td class="text-start fw-bold">{{ p.name }}</td>
                                <td class="text-danger fw-bold">{{"{:,.0f}".format(p.price)}} Đ</td>
                                <td>{{ p.provider_name }}</td>
                                <td class="text-start"><a href="{{ p.url }}" target="_blank" class="text-truncate d-inline-block" style="max-width:180px;">{{ p.url }}</a></td>
                                <td><a href="/admin/product/delete/{{ p.id }}" class="btn btn-sm text-danger"><i class="fa-solid fa-trash"></i></a></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
